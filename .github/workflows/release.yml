name: Release

# Runs when a version tag is pushed: v0.50.0 is a release; v0.50.0-rc4 is a
# pre-release. The tag must match the version in daemon/pyproject.toml, in its
# PEP 440 form: v0.50.0 needs 0.50.0 and v0.50.0-rc4 needs 0.50.0rc4.
#
# One job builds everything in order, so nothing is published unless the
# tests, the tag check and the wheel check all pass:
#   1. the tag matches the package version
#   2. the test suite
#   3. the wheel (carrying the Presto app) and the source archive, checked
#   4. the container image, pushed to ghcr.io (a "latest" tag moves only for a
#      full release)
#   5. a GitHub Release with the files and their SHA-256 sums
#   6. the same wheel and source archive, as attached to that Release, go to
#      PyPI for a full release (the "publish" job below) or to TestPyPI for a
#      pre-release (the "publish-test" job)
#
# The release job uses only the GitHub CLI and Docker that the runner already
# has. Every action it and the publish job use is pinned to a commit, as in the
# other workflows.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: write   # create the GitHub Release
  packages: write   # push the image to ghcr.io

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"

      - name: Install the build tools and the daemon's dependency
        run: python -m pip install build "cryptography>=46" "mpremote>=1.24,<2"

      - name: Check the tag against the package version
        run: python tools/build_release.py --tag "$TAG" --stage-only

      - name: Run the tests
        working-directory: daemon
        run: python -m unittest discover -s tests -q

      - name: Build and check the wheel and the source archive
        run: |
          python tools/build_release.py
          cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Build and push the container image
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          VERSION="${TAG#v}"
          echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build --build-arg DASH_RELEASE_VERSION="$VERSION" -t "$IMAGE:$VERSION" .
          docker push "$IMAGE:$VERSION"
          # "latest" is the stable tag users pull. A pre-release never moves it.
          if [[ "$VERSION" != *-* ]]; then
            docker tag "$IMAGE:$VERSION" "$IMAGE:latest"
            docker push "$IMAGE:latest"
          fi

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FLAGS="--generate-notes"
          if [[ "$TAG" == *-* ]]; then FLAGS="$FLAGS --prerelease"; fi
          # The compose file and its .env template travel with the release, so
          # a machine without a checkout can follow the Docker guide.
          gh release create "$TAG" dist/* compose.yaml .env.example --title "$TAG" $FLAGS

  # A pre-release (v0.50.0-rc4) goes to TestPyPI, a rehearsal of the real
  # publish below. Each tag builds its own version (0.50.0rc4; the tag check
  # enforces it), so every candidate uploads and pip can upgrade between them.
  # skip-existing only lets a re-run of the same tag succeed. TestPyPI trusts
  # this workflow and the "testpypi" environment (set up once on test.pypi.org).
  publish-test:
    needs: release
    if: ${{ contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: testpypi
    permissions:
      contents: read     # download the files from the GitHub Release
      id-token: write    # trusted publishing to TestPyPI
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Download the wheel and the source archive from the Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir dist
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist --pattern '*.whl' --pattern '*.tar.gz'
          ls -l dist

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  # Only a tag without a "-" (a full release, package version 0.50.0) reaches
  # PyPI; candidates stop at TestPyPI above. It publishes through PyPI's trusted
  # publishing: no token is stored; PyPI trusts this workflow, this repository
  # and the "pypi" environment (set up once on pypi.org).
  publish:
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      contents: read     # download the files from the GitHub Release
      id-token: write    # trusted publishing to PyPI
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Download the wheel and the source archive from the Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir dist
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist             --pattern '*.whl' --pattern '*.tar.gz'
          ls -l dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
