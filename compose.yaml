# The daemon and its admin page.
#
#   cp .env.example .env      (fill in the tokens)
#   docker compose up -d
#
# The device port (8787) is published so the Presto can poll it, on every
# address of this host unless DASH_PUBLISH_ADDRESS in .env names one (the
# host's LAN address). Docker's own firewall rules bypass ufw and firewalld,
# so on a host with a public interface, set it. The admin page is published on
# 127.0.0.1 only: it is reachable from this machine and from nowhere else. See
# https://jake1164.github.io/presto-ai-dash/getting-started/install-with-docker/
# (source: docs/user/getting-started/install-with-docker.md).

services:
  dash:
    # The published image. "latest" moves to every full release, so
    # "docker compose pull && docker compose up -d" upgrades. To pin a version,
    # set DASH_IMAGE=ghcr.io/jake1164/presto-ai-dash:0.50.0 in .env. To build
    # from this checkout instead, use compose.build.yaml (see the docs).
    image: ${DASH_IMAGE:-ghcr.io/jake1164/presto-ai-dash:latest}
    container_name: presto-ai-dash
    restart: unless-stopped
    environment:
      # The device port. The Presto polls this one.
      DASH_HOST: "0.0.0.0"
      DASH_PORT: "8787"
      # The admin page. It needs a bind address, an explicit token and the
      # names it is reached by before it may listen on anything but loopback.
      DASH_ADMIN_HOST: "0.0.0.0"
      DASH_ADMIN_PORT: "8788"
      # The names the admin page answers to. This machine always works; to reach
      # the page from another computer, add the name the browser will use (for
      # example 192.168.1.50:8788) to DASH_ADMIN_ALLOWED_HOSTS in .env.
      DASH_ADMIN_ALLOWED_HOSTS: "${DASH_ADMIN_ALLOWED_HOSTS:-localhost:8788,127.0.0.1:8788}"
      DASH_ADMIN_TOKEN: "${DASH_ADMIN_TOKEN:?set DASH_ADMIN_TOKEN in .env}"
      # The token the Presto device holds. Required: a temporary one would be
      # written to Docker's log, which outlives the container.
      DASH_SHARED_TOKEN: "${DASH_SHARED_TOKEN:?set DASH_SHARED_TOKEN in .env}"
      # The database and its key file, in the volume below.
      DASH_DATABASE: "/data/dash.db"
      DASH_KEY_FILE: "/data/dash.db.key"
      # The remote reports (push) switch. Off until it is turned on. Leave it
      # unset in .env to tick "Accept remote reports" in the admin page; set it
      # to 1 or 0 there to fix the choice, which locks that checkbox. With no
      # value here, Compose passes it on only when it is set in .env.
      DASH_INGEST_ENABLED:
      # The Presto's screen in a browser, a test aid, off unless it is set to 1
      # in .env. The page has no sign-in, so its port is published on this
      # machine only (see ports). Leave the port and names alone unless you
      # change the published port.
      DASH_PRESTO_PREVIEW:
      DASH_PRESTO_PREVIEW_HOST: "0.0.0.0"
      DASH_PRESTO_PREVIEW_PORT: "8790"
      DASH_PRESTO_PREVIEW_ALLOWED_HOSTS: "${DASH_PRESTO_PREVIEW_ALLOWED_HOSTS:-localhost:8790,127.0.0.1:8790}"
      # Demo mode: sample data on the device and the API, off unless asked for.
      # It overrides the real sources while it is on; nothing is written.
      # DASH_DEMO: "1"
      # The encryption master key. Leave empty to use the key file in the
      # volume; set it to move the database to another machine.
      DASH_ENCRYPTION_KEY: "${DASH_ENCRYPTION_KEY:-}"
      DASH_LOG_LEVEL: "${DASH_LOG_LEVEL:-INFO}"
      DASH_OVERFLOW_ROWS: "${DASH_OVERFLOW_ROWS:-1}"
      # The time zone of the process. A container starts in UTC, and the
      # quiet hours and the weekly reset estimate use the local time, so set
      # TZ in .env to your own zone (for example America/New_York).
      TZ: "${TZ:-UTC}"
    # The daemon needs nothing of the kernel beyond ordinary file and socket
    # use, and writes only to /data (and a scratch /tmp).
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - dash-data:/data
    ports:
      # The device port, on every address unless DASH_PUBLISH_ADDRESS names one.
      - "${DASH_PUBLISH_ADDRESS:-0.0.0.0}:8787:8787"
      # The admin page, on this machine only.
      - "127.0.0.1:8788:8788"
      # The Presto preview, on this machine only. Nothing listens on it unless
      # DASH_PRESTO_PREVIEW=1.
      - "127.0.0.1:8790:8790"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/healthz', timeout=3).read()"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  dash-data:
