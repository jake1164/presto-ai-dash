[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "presto-ai-dash"
version = "0.50.0rc4"
description = "Shows your AI usage and quota limits on a Pimoroni Presto display: a small daemon, an admin page and the device app."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["ai", "usage", "quota", "claude", "codex", "ollama", "litellm", "pimoroni", "presto"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
]
# Authenticated encryption for database-backed provider credentials.
dependencies = ["cryptography>=46.0.0"]

[tool.setuptools.package-data]
# presto_app/ is the Presto device app, copied in at release time by
# tools/build_release.py (it is not in git). setup/ holds the standalone
# installer template the admin page renders for the exact running bundle.
presto_ai_dash = ["web/*.html", "web/*.js", "web/*.css",
                  "presto_app/*.py", "presto_app/ai_dash_files/*.py",
                  "presto_app/ai_dash_files/*.txt",
                  "setup/*.py"]

[project.optional-dependencies]
dev = []
device = ["mpremote>=1.24,<2"]

[project.urls]
Homepage = "https://github.com/jake1164/presto-ai-dash"
Documentation = "https://jake1164.github.io/presto-ai-dash/"
Issues = "https://github.com/jake1164/presto-ai-dash/issues"
Changelog = "https://github.com/jake1164/presto-ai-dash/releases"

[project.scripts]
presto-ai-dash = "presto_ai_dash.app:main"

[tool.setuptools.packages.find]
where = ["src"]
