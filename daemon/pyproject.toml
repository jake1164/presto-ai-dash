[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "presto-ai-dash-daemon"
version = "0.50.0"
description = "Small local daemon that collects AI usage/status and serves it to a Pimoroni Presto display."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
# Authenticated encryption for database-backed provider credentials.
dependencies = ["cryptography>=46.0.0"]

[tool.setuptools.package-data]
# presto_app/ is the Presto device app, copied in at release time by
# tools/build_release.py (it is not in git).
presto_ai_dash = ["web/*.html", "web/*.js", "web/*.css",
                  "presto_app/*.py", "presto_app/ai_dash_files/*.py",
                  "presto_app/ai_dash_files/*.txt"]

[project.optional-dependencies]
dev = []
device = ["mpremote>=1.24,<2"]

[project.scripts]
presto-ai-dash = "presto_ai_dash.app:main"

[tool.setuptools.packages.find]
where = ["src"]
