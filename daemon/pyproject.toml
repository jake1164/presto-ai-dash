[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "presto-ai-pulse-daemon"
version = "0.1.0"
description = "Small local daemon that collects AI usage/status and serves it to a Pimoroni Presto display."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
# Deliberately empty. The daemon uses only the standard library.
dependencies = []

[project.optional-dependencies]
dev = []

[project.scripts]
presto-ai-pulse = "presto_ai_pulse.app:main"

[tool.setuptools.packages.find]
where = ["src"]
