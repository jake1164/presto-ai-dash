# Presto AI Pulse - example daemon configuration
#
# Copy to `pulse.toml` next to wherever you run the daemon, or pass
# `--config /path/to/pulse.toml`. Every key below is optional; the values
# shown are the defaults.
#
# The daemon has no third-party dependencies. Config is TOML because Python's
# standard library can read it (tomllib, Python 3.11+).

[daemon]
# Bind address. Defaults to all interfaces so the Presto can reach it on the
# LAN. Do NOT port-forward this. See docs/setup.md.
host = "0.0.0.0"
port = 8787

# Shared token the Presto must present as `Authorization: Bearer <token>`.
# Leave empty and one is generated at startup and printed once to the log.
shared_token = ""

# Seconds between source collections.
poll_interval = 15

# SQLite file for snapshot history.
database = "pulse.db"

# Hours of snapshot history to keep.
retention_hours = 72

# How often to run the retention sweep, in seconds.
retention_sweep_interval = 900

[logging]
# One of: DEBUG, INFO, WARNING, ERROR
level = "INFO"

# --- Sources ---------------------------------------------------------------
# Enable/disable each source. `fake` is on by default so the device has
# something to show before real integrations are configured.

[sources.fake]
enabled = true
# Seconds each demo scenario is held before advancing.
scenario_interval = 20

[sources.ollama]
enabled = false
# Ollama's HTTP API base URL.
base_url = "http://jake-desktop:11434"
# Request timeout in seconds.
timeout = 5
# Optional JSON file written by a collector/shim holding the last *measured*
# request. Ollama itself exposes no request history - see docs/limitations.md.
# Leave empty to show "last measured: unavailable".
samples_file = ""

[sources.litellm]
enabled = false
# LiteLLM proxy base URL.
base_url = "http://toontown-int-srv1:4000"
# A LiteLLM virtual key. Read-only usage reporting is enough; the daemon never
# makes model calls. Prefer the PULSE_LITELLM_API_KEY environment variable so
# the key is not written to disk.
api_key = ""
# Request timeout in seconds.
timeout = 5

# --- Alerts ----------------------------------------------------------------
# Thresholds are advisory: they decide when a card escalates to `warning` or
# `critical`. They are not a rule engine.

[alerts]
# Warn when LiteLLM daily spend reaches this many dollars. 0 disables.
litellm_daily_spend_warn = 0
litellm_daily_spend_critical = 0
# Warn when LiteLLM daily requests reach this count. 0 disables.
litellm_daily_requests_warn = 0
litellm_daily_requests_critical = 0
# Warn when LiteLLM reports this many failed requests today. 0 disables.
litellm_daily_errors_warn = 0
litellm_daily_errors_critical = 0
