# Presto AI Dash - example daemon configuration
#
# Copy to `dash.toml` next to wherever you run the daemon, or pass
# `--config /path/to/dash.toml`. Every key below is optional; the values
# shown are the defaults.
#
# TOML holds bootstrap settings. The cryptography package encrypts saved keys.
# After first --admin startup, SQLite owns the source/account configuration.

[daemon]
# Bind address. Defaults to all interfaces so the Presto can reach it on the
# LAN. Do NOT port-forward this. See docs/setup.md.
host = "0.0.0.0"
port = 8787

# Shared token the Presto must present as `Authorization: Bearer <token>`.
# Leave empty and one is generated at startup and printed once to the log.
shared_token = ""

# Seconds between source collections.
poll_interval = 15

# SQLite file for snapshots and alert observations.
database = "dash.db"

# Keep snapshot and alert history for 72 hours. Cleanup runs every 300 seconds.
retention_hours = 72
cleanup_interval = 300

[logging]
# One of: DEBUG, INFO, WARNING, ERROR, CRITICAL
level = "INFO"

[admin]
# Enable here or run with --admin. The configuration page binds only to
# 127.0.0.1; the device's status endpoint continues using daemon.host.
enabled = false
port = 8788
# Separate from shared_token. DASH_ADMIN_TOKEN overrides this value.
# Empty generates a temporary token and prints it to the startup log.
# Browser login is remembered for seven days in SQLite, even with fresh tokens.
token = ""
# Empty uses <database>.key outside SQLite. DASH_KEY_FILE overrides it.
# DASH_ENCRYPTION_KEY can instead supply a Fernet master key.
key_file = ""

# --- Alerts ----------------------------------------------------------------
# These apply to every service. The admin page's Alerts section overrides
# them; see docs/configuration.md.

[alerts]
# A quota window at this percentage makes the service "near limit" (yellow).
warning_percent = 80
# A quota window at this percentage makes the service "critical" (red).
# It must be above the warning percent. At 100% a service is rate limited.
critical_percent = 95
# Sound a short cue when a service gets worse.
sound = true
# Be silent and dim the light during the quiet window. The times are the
# local time of the machine the daemon runs on.
quiet_hours = false
quiet_start = "22:00"
quiet_end = "07:00"
# Let the Presto's Home list scroll to a service that has just got worse.
pop_to_top = true

# --- Sources ---------------------------------------------------------------
# Fake data is enabled by default. Disable it before enabling a live source so
# synthetic metrics can never be mistaken for real usage.

[sources.fake]
enabled = true
# Seconds each demo scenario is held before advancing.
scenario_interval = 20

[sources.ollama]
enabled = false
base_url = "http://localhost:11434"
timeout = 5
# Optional JSON object or list written by a request-observing collector.
samples_file = ""

[sources.litellm]
enabled = false
base_url = "http://localhost:4000"
timeout = 5
# The environment variable overrides this value. Avoid storing secrets here.
api_key = ""
api_key_env = "LITELLM_API_KEY"
